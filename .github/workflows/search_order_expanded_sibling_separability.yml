name: Search-order expanded-sibling separability audit

on:
  push:
    branches:
      - transfer/turbodfs-opt-v2-repair
    paths:
      - '.github/workflows/search_order_expanded_sibling_separability.yml'
      - 'scripts/audit_search_order_expanded_sibling_separability_v1.py'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install CPU audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.1.3 scikit-learn==1.5.2

      - name: Clone Gold mirror
        run: git clone --depth 1 https://github.com/poetiq-ai/poetiq-arc-agi-solver.git /tmp/poetiq

      - name: Run expanded-sibling leakage guard
        run: |
          python scripts/audit_search_order_expanded_sibling_separability_v1.py \
            --d24 artifacts/eval60_phase3_d24_aug8_r1024_archive_v1 \
            --score analysis/eval60_phase3_d24_d48_r1024_score_v1/OUTPUT_RESULTS.csv \
            --solutions /tmp/poetiq/data/arc-prize-2025/arc-agi_evaluation_solutions.json \
            --expected-solutions-sha256 84be4f4f39b79e82c36d565fc878830988b094917f052ee7069aef30b33ca8f1 \
            --output search_order_expanded_sibling_output

      - name: Show audit
        run: |
          cat search_order_expanded_sibling_output/DATASET_SUMMARY.json
          cat search_order_expanded_sibling_output/METRICS.json
          cat search_order_expanded_sibling_output/DECISION.json

      - name: Commit frozen audit artifacts
        run: |
          DEST=analysis/search_order_expanded_sibling_separability_v1
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -a search_order_expanded_sibling_output/. "$DEST/"
          git config user.name "github-actions[bot]"
          git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "analysis: freeze expanded-sibling separability v1"
          git push origin HEAD:transfer/turbodfs-opt-v2-repair

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: search-order-expanded-sibling-v1
          path: search_order_expanded_sibling_output/
