name: Top5 hidden smoke CPU audit
on:
  push:
    branches: [transfer/turbodfs-opt-v2-repair]
    paths:
      - 'analysis/top5_passive_hidden_state_micro12_v1/smoke_hidden_incremental_audit.py'
      - '.github/workflows/top5_hidden_smoke_cpu_audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q numpy==2.1.3 scikit-learn==1.5.2
      - name: Run no-Gold smoke audit
        run: python analysis/top5_passive_hidden_state_micro12_v1/smoke_hidden_incremental_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-hidden-incremental-signal-audit
          path: smoke_hidden_incremental_signal_audit.json
