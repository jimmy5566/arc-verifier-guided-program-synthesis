name: Phase3 post-freeze CPU score

on:
  push:
    branches:
      - transfer/turbodfs-opt-v2-repair
    paths:
      - '.github/workflows/phase3_score.yml'
      - 'scripts/score_phase3_eval60_union_v1.py'

jobs:
  score:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone frozen Kaggle 2025 data mirror
        run: git clone --depth 1 https://github.com/poetiq-ai/poetiq-arc-agi-solver.git /tmp/poetiq

      - name: Verify exact challenge and Gold snapshot
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
              Path("/tmp/poetiq/data/arc-prize-2025/arc-agi_evaluation_challenges.json"): "e7c62a4bd211867c6b538f66b8013b81f299663c82ca062f49a52bf439d6e4e8",
              Path("/tmp/poetiq/data/arc-prize-2025/arc-agi_evaluation_solutions.json"): "84be4f4f39d79e82c36d565fc878830988b094917f052ee7069aef30b33ca8f1",
          }
          for path, wanted in expected.items():
              got = hashlib.sha256(path.read_bytes()).hexdigest()
              print(path, got)
              assert got == wanted, (path, got, wanted)
          PY

      - name: Run CPU-only scorer
        run: |
          python scripts/score_phase3_eval60_union_v1.py \
            --d24 artifacts/eval60_phase3_d24_aug8_r1024_archive_v1 \
            --d48 artifacts/eval60_phase3_d48_aug8_r1024_archive_v1 \
            --solutions-json /tmp/poetiq/data/arc-prize-2025/arc-agi_evaluation_solutions.json \
            --expected-solutions-sha256 84be4f4f39d79e82c36d565fc878830988b094917f052ee7069aef30b33ca8f1 \
            --output phase3_score_output

      - name: Show summary
        run: |
          cat phase3_score_output/SUMMARY.json
          cat phase3_score_output/REPORT.md

      - name: Upload score artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase3-score-output
          path: phase3_score_output/
