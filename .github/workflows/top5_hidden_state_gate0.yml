name: Top5 passive hidden-state Gate 0

on:
  push:
    branches:
      - transfer/turbodfs-opt-v2-repair
    paths:
      - '.github/workflows/top5_hidden_state_gate0.yml'
      - 'src/inference/nvarc_turbodfs_dynamic_ready.py'
      - 'src/inference/nvarc_turbodfs_search_order.py'
      - 'src/inference/rolling_resident_pool.py'
      - 'scripts/run_eval60_budget_eos_pilot18_v1.py'
      - 'scripts/run_ttt24_aug8_r1024_core_v1.py'
      - 'tests/test_nvarc_turbodfs_dynamic_ready.py'
      - 'tests/test_nvarc_turbodfs_search_order.py'

jobs:
  gate0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.3.5 numpy==2.1.3
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile modified runners
        run: |
          python -m py_compile             src/inference/nvarc_turbodfs_dynamic_ready.py             src/inference/nvarc_turbodfs_search_order.py             src/inference/rolling_resident_pool.py             scripts/run_eval60_budget_eos_pilot18_v1.py             scripts/run_ttt24_aug8_r1024_core_v1.py
      - name: Hidden-state and search-order contracts
        env:
          PYTHONPATH: .:src
        run: |
          pytest -q             tests/test_nvarc_turbodfs_dynamic_ready.py             tests/test_nvarc_turbodfs_search_order.py             tests/test_search_order.py
      - name: Existing frozen cohort and adapter guards
        env:
          PYTHONPATH: .:src
        run: |
          pytest -q             tests/test_audit_search_order_adapters.py             tests/test_build_search_order_micro24_cohort.py
