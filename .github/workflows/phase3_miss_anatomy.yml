name: Phase3 miss anatomy CPU audit

on:
  push:
    branches:
      - transfer/turbodfs-opt-v2-repair
    paths:
      - '.github/workflows/phase3_miss_anatomy.yml'
      - 'scripts/audit_phase3_miss_anatomy_v1.py'

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone exact Kaggle 2025 Gold mirror
        run: git clone --depth 1 https://github.com/poetiq-ai/poetiq-arc-agi-solver.git /tmp/poetiq

      - name: Run CPU-only final-R1024 causal audit
        run: |
          python scripts/audit_phase3_miss_anatomy_v1.py \
            --d24 artifacts/eval60_phase3_d24_aug8_r1024_archive_v1 \
            --d48 artifacts/eval60_phase3_d48_aug8_r1024_archive_v1 \
            --score analysis/eval60_phase3_d24_d48_r1024_score_v1/OUTPUT_RESULTS.csv \
            --solutions /tmp/poetiq/data/arc-prize-2025/arc-agi_evaluation_solutions.json \
            --expected-solutions-sha256 84be4f4f39b79e82c36d565fc878830988b094917f052ee7069aef30b33ca8f1 \
            --output phase3_miss_anatomy_output

      - name: Show summary
        run: |
          cat phase3_miss_anatomy_output/SUMMARY.json
          cat phase3_miss_anatomy_output/MISS_IDS_BY_PRIMARY.json

      - name: Commit audit artifacts
        run: |
          DEST=analysis/eval60_phase3_r1024_miss_anatomy_v1
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -a phase3_miss_anatomy_output/. "$DEST/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "analysis: freeze Phase3 R1024 miss anatomy"
          git push origin HEAD:transfer/turbodfs-opt-v2-repair

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase3-miss-anatomy-output
          path: phase3_miss_anatomy_output/
